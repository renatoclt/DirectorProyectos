name: Validate agent system

on:
  push:
    paths:
      - '.github/agents/**'
      - '.github/instructions/**'
      - '.github/prompts/**'
      - 'governance/**'
      - 'testing/**'
      - 'aprendizaje/**'
      - 'README.md'
      - 'MAPA-DEL-SISTEMA.md'
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/instructions/**'
      - '.github/prompts/**'
      - 'governance/**'
      - 'testing/**'
      - 'aprendizaje/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r testing/requirements.txt
      - run: python testing/run_tests.py
